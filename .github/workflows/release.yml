name: Release

# Construit le binaire statique Linux x86_64 (musl), utilisable sous WSL2,
# et le publie dans une release GitHub à chaque tag vX.Y.Z.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)construire, par exemple v0.4.0"
        required: true

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux x86_64 (WSL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      # factory:release tague sans toucher au code : la version des manifestes
      # est prise du tag ici, avant de construire.
      - name: Version du tag
        run: |
          version="${TAG#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag $TAG : attendu vX.Y.Z"; exit 1; }
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          sed -i "/^name = \"yaide\"\$/{n;s/^version = \".*\"/version = \"$version\"/}" Cargo.lock
          npm version "$version" --no-git-tag-version --allow-same-version
          git diff --stat

      - name: Interface web
        run: |
          npm ci
          npm run build

      - name: Binaire
        run: cargo build --release --locked --target "$TARGET"

      - name: Archive
        run: |
          bin="target/$TARGET/release/yaide"
          file "$bin"
          file "$bin" | grep -Eq "statically linked|static-pie linked"
          nom="yaide-$TAG-x86_64-linux"
          mkdir -p "dist/$nom"
          cp "$bin" README.md "dist/$nom/"
          tar -C dist -czf "dist/$nom.tar.gz" "$nom"
          (cd dist && sha256sum "$nom.tar.gz" > "$nom.tar.gz.sha256")
          echo "ARCHIVE=dist/$nom.tar.gz" >> "$GITHUB_ENV"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "Yaide $TAG" --generate-notes --verify-tag
          fi
